# User-facing compose file. Pin the image tag for reproducibility.
# To follow the latest published image, change the tag below to:
#   ghcr.io/genesis-scaffolding/comfyui-rocm:latest-rocm-7.14-amd64
#
# The rocm/dev-ubuntu-24.04 base is linux/amd64 only. ROCm has no stable
# arm64 support, so there is no arm64 tag — same as the official
# rocm/comfyui image.
#
# Supported GPU architectures: gfx1201 (RDNA 4) and gfx1100 (RDNA 3)
# only. See docs/AMD-GPU-COMPATIBILITY.md.

services:
  comfyui:
    hostname: comfyui
    image: "ghcr.io/genesis-scaffolding/comfyui-rocm:v0.43.0-rocm-7.14-amd64"
    restart: "unless-stopped"
    # ROCm device access. Replaces the NVIDIA-specific `runtime: nvidia`
    # and `gpus:` blocks used by the cuda repo:
    #   - /dev/kfd: KFD (Kernel Fusion Driver) — ROCm compute entry point
    #   - /dev/dri: Direct Rendering Infrastructure — GPU node access
    #   - group_add: video: required to open /dev/dri/renderD* nodes
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    command:
      # Pass extra arguments to ComfyUI here.
      # https://docs.comfy.org/interface/settings/server-config
      - "--verbose"
    environment:
      PUID: "1000"  # adapt to your host user
      PGID: "1000"  # adapt to your host group
      # COMFYUI_NO_DEFAULTS: "true" disables the entrypoint's default flags
      # ROCm-specific env:
      HIP_VISIBLE_DEVICES: "0"
      # On a hybrid APU + dGPU machine (e.g. R9700 + Ryzen iGPU) the
      # iGPU is an unsupported target whose kernels were pruned, so
      # the runtime must not initialise on it. Set ROCR_VISIBLE_DEVICES
      # to the ROCr device index of the dGPU if that happens — it
      # filters at the ROCr layer, which is also what rocminfo
      # reports, so the entrypoint's gfx check sees only that GPU.
      # ROCR_VISIBLE_DEVICES: "0"
      # Do NOT use HSA_OVERRIDE_GFX_VERSION for this: it overrides the
      # gfx code the kernel driver reports and breaks ROCm entirely on
      # a mixed system.
      # torch.cuda.is_available() is the canonical check on ROCm too,
      # but disambiguate from any host CUDA setup
      CUDA_VISIBLE_DEVICES: ""
      # Required to enable AOTriton (AMD's GPU attention kernels).
      # Without this, torch's scaled_dot_product_attention falls back
      # to the math backend (CPU) and ComfyUI hammers the CPU at 100%
      # while the GPU sits idle. With this, attention runs on the GPU
      # (~14x speedup on gfx1151 RDNA 3.5; similar gains on RDNA 4).
      # See docs/AMD-GPU-COMPATIBILITY.md.
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    ports:
      - "8188:8188"
    volumes:
      # Persist any custom nodes you install via Manager
      - "./data/custom_nodes:/opt/comfyui/app/custom_nodes"

      # Persist models (download manually into ./data/models/<subdir>)
      - "./data/models:/opt/comfyui/app/models"

      # Persist input / output images
      - "./data/input:/opt/comfyui/app/input"
      - "./data/output:/opt/comfyui/app/output"

      # Persist user profiles (workflows, Manager config, ...)
      - "./data/profiles:/opt/comfyui/app/user"

      # Persist the Python venv between container recreations
      - "./data/python:/opt/comfyui/python"
